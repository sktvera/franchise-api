spring:
  application:
    name: franchise-api

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo-franchises:27017/franchisesdb}

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.web.reactive.result.method.annotation.RequestMappingHandlerMapping: TRACE
    org.springdoc: DEBUG
